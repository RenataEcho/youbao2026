<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>右豹管理后台 · 登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-active: #1e40af;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --danger: #dc2626;
      --success: #16a34a;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface-hover: #f8fafc;
      --border: #e8edf3;
      --text-primary: #18222f;
      --text-secondary: #4a5568;
      --text-muted: #9aa5b4;
      --shadow-lg: 0 8px 28px rgba(30,40,60,0.11);
      --shadow-xl: 0 16px 48px rgba(30,40,60,0.14);
      --radius: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --transition: all 0.16s ease;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273348;
      --border: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
      --shadow-lg: 0 8px 28px rgba(0,0,0,0.45);
      --shadow-xl: 0 16px 48px rgba(0,0,0,0.55);
    }

    html, body {
      height: 100%;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ============ 背景画布 ============ */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 35%, #e0f2fe 65%, #d1fae5 100%);
      overflow: hidden;
    }

    [data-theme="dark"] .bg-scene {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #0c1a2e 100%);
    }

    /* 大光晕 */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
    }
    .bg-orb-1 {
      width: 700px; height: 700px;
      top: -200px; left: -150px;
      background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
      animation: orbDrift1 18s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 600px; height: 600px;
      bottom: -180px; right: -100px;
      background: radial-gradient(circle, rgba(14,165,233,0.16) 0%, transparent 70%);
      animation: orbDrift2 22s ease-in-out infinite;
    }
    .bg-orb-3 {
      width: 400px; height: 400px;
      top: 40%; left: 55%;
      background: radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
      animation: orbDrift3 26s ease-in-out infinite;
    }
    [data-theme="dark"] .bg-orb-1 { background: radial-gradient(circle, rgba(99,102,241,0.30) 0%, transparent 70%); }
    [data-theme="dark"] .bg-orb-2 { background: radial-gradient(circle, rgba(14,165,233,0.24) 0%, transparent 70%); }
    [data-theme="dark"] .bg-orb-3 { background: radial-gradient(circle, rgba(16,185,129,0.16) 0%, transparent 70%); }

    @keyframes orbDrift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,-30px) scale(1.05); }
      66% { transform: translate(-20px,40px) scale(0.96); }
    }
    @keyframes orbDrift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40% { transform: translate(-50px,30px) scale(1.08); }
      70% { transform: translate(30px,-40px) scale(0.94); }
    }
    @keyframes orbDrift3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-30px,-50px) scale(1.12); }
    }

    /* 粒子 */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: particleFly var(--dur) var(--delay) ease-in-out infinite;
    }
    @keyframes particleFly {
      0%   { opacity: 0; transform: translateY(0) scale(0.4); }
      20%  { opacity: 0.6; }
      80%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-120px) scale(1); }
    }

    /* ============ 左侧插画区 ============ */
    .illustration-panel {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 52%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    @media (max-width: 900px) {
      .illustration-panel { display: none; }
    }

    .illus-wrap {
      position: relative;
      width: 420px;
      height: 380px;
    }

    /* 主插画 SVG */
    .illus-main {
      width: 100%; height: 100%;
      animation: illusFloat 6s ease-in-out infinite;
      filter: drop-shadow(0 24px 48px rgba(37,99,235,0.15));
    }
    @keyframes illusFloat {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(1deg); }
    }

    /* 装饰小元素 */
    .illus-badge {
      position: absolute;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      box-shadow: 0 4px 16px rgba(30,40,60,0.10);
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      animation: badgePop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
      opacity: 0;
    }
    [data-theme="dark"] .illus-badge {
      background: rgba(30,41,59,0.90);
      border-color: rgba(255,255,255,0.10);
    }
    .illus-badge-1 { top: 18px; left: 24px; animation-delay: 0.8s; }
    .illus-badge-2 { bottom: 55px; left: 10px; animation-delay: 1.1s; }
    .illus-badge-3 { top: 44%; right: -8px; animation-delay: 1.4s; }
    @keyframes badgePop {
      from { opacity:0; transform: scale(0.8) translateY(8px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .badge-dot-green { width:8px;height:8px;border-radius:50%;background:#16a34a;flex-shrink:0; }
    .badge-dot-blue  { width:8px;height:8px;border-radius:50%;background:#2563eb;flex-shrink:0; }
    .badge-dot-amber { width:8px;height:8px;border-radius:50%;background:#d97706;flex-shrink:0; }

    /* 小数字卡片 */
    .illus-stat {
      position: absolute;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 10px;
      padding: 10px 16px;
      box-shadow: 0 4px 16px rgba(30,40,60,0.10);
      opacity: 0;
      animation: badgePop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    [data-theme="dark"] .illus-stat {
      background: rgba(30,41,59,0.85);
      border-color: rgba(255,255,255,0.08);
    }
    .illus-stat-1 { bottom: 10px; right: 30px; animation-delay: 1.7s; }
    .illus-stat-val { font-size: 20px; font-weight: 700; color: var(--primary); line-height: 1; }
    .illus-stat-lab { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ============ 登录卡片 ============ */
    .login-wrap {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 24px max(24px, calc(50vw - 660px)) 24px 24px;
    }

    @media (max-width: 900px) {
      .login-wrap {
        justify-content: center;
        padding: 24px;
      }
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 40px rgba(30, 40, 80, 0.13), inset 0 1px 0 rgba(255,255,255,0.95);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      animation: cardIn 0.7s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(24px) scale(0.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    [data-theme="dark"] .login-card {
      background: rgba(30, 41, 59, 0.80);
      backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.50), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37,99,235,0.35);
    }

    .logo-icon svg { color: #fff; }

    .logo-text {
      display: flex; flex-direction: column;
    }

    .logo-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .login-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-label .required {
      color: var(--danger);
    }

    .input-wrap {
      position: relative;
    }

    .input-prefix {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 38px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .form-input::placeholder { color: var(--text-muted); }

    .form-input-suffix {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      transition: var(--transition);
    }

    .form-input-suffix:hover { color: var(--text-secondary); }

    .captcha-row {
      display: flex;
      gap: 10px;
    }

    .captcha-row .form-input {
      flex: 1;
    }

    .captcha-img {
      width: 110px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--primary);
      flex-shrink: 0;
      user-select: none;
      font-family: 'SFMono-Regular', 'Consolas', monospace;
      position: relative;
      overflow: hidden;
    }

    .captcha-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(99,102,241,0.05) 3px, rgba(99,102,241,0.05) 4px);
    }

    .form-extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 20px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .forget-link {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
    }

    .forget-link:hover { color: var(--primary-hover); }

    .btn-login {
      width: 100%;
      height: 42px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #1d4ed8, #4338ca);
      box-shadow: 0 6px 20px rgba(37,99,235,0.45);
      transform: translateY(-1px);
    }
    .btn-login:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    }

    .btn-login.loading {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .error-msg {
      display: none;
      margin-top: 6px;
      font-size: 11px;
      color: var(--danger);
    }

    .error-msg.show { display: block; }

    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 2px 8px rgba(30,40,60,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    [data-theme="dark"] .theme-toggle {
      background: rgba(30,41,59,0.75);
      border-color: rgba(255,255,255,0.1);
    }

    .theme-toggle:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(30,40,60,0.18);
    }

    .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    /* ============ 全屏加载遮罩 ============ */
    .page-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 40%, #e0f2fe 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    [data-theme="dark"] .page-loader {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c1a2e 100%);
    }
    .page-loader.active {
      opacity: 1;
      pointer-events: all;
    }

    .loader-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      animation: loaderLogoIn 0.5s 0.1s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes loaderLogoIn {
      from { opacity:0; transform: scale(0.7); }
      to   { opacity:1; transform: scale(1); }
    }
    .loader-logo-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 28px rgba(37,99,235,0.4);
      color: #fff;
    }
    .loader-logo-text {
      display: flex; flex-direction: column;
    }
    .loader-logo-name {
      font-size: 22px; font-weight: 700;
      color: var(--text-primary);
    }
    .loader-logo-sub {
      font-size: 12px; color: var(--text-muted);
    }

    .loader-bar-wrap {
      width: 200px;
      background: rgba(255,255,255,0.4);
      border-radius: 99px;
      height: 4px;
      overflow: hidden;
      animation: loaderBarIn 0.4s 0.3s ease both;
    }
    @keyframes loaderBarIn {
      from { opacity:0; width: 0px; }
      to   { opacity:1; width: 200px; }
    }
    .loader-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed, #06b6d4);
      border-radius: 99px;
      width: 0%;
      animation: loaderProgress 1.4s 0.4s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes loaderProgress {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 75%; }
      90%  { width: 88%; }
      100% { width: 100%; }
    }

    .loader-tip {
      font-size: 13px;
      color: var(--text-muted);
      animation: loaderTipIn 0.4s 0.4s ease both;
    }
    @keyframes loaderTipIn {
      from { opacity:0; }
      to   { opacity:1; }
    }

    /* 欢迎弹出小提示 */
    .welcome-toast {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 9998;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(37,99,235,0.15);
      border-radius: 99px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary);
      box-shadow: 0 4px 20px rgba(37,99,235,0.15);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(.34,1.56,.64,1);
    }
    [data-theme="dark"] .welcome-toast {
      background: rgba(30,41,59,0.92);
    }
    .welcome-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .login-card { padding: 28px 20px; }
    }

    /* ============ SVG 插画动效 ============ */
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes gearSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>

<!-- 背景场景 -->
<div class="bg-scene" id="bgScene">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <!-- 粒子由JS生成 -->
</div>

<!-- 右侧插画 -->
<div class="illustration-panel">
  <div class="illus-wrap">
    <!-- 主插画 SVG：数据分析/工作场景风格 -->
    <svg class="illus-main" viewBox="0 0 420 380" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 背景卡片 -->
      <rect x="20" y="30" width="380" height="320" rx="24" fill="url(#card_grad)" opacity="0.13"/>
      <!-- 底部平台 -->
      <ellipse cx="210" cy="340" rx="170" ry="22" fill="url(#shadow_grad)" opacity="0.18"/>

      <!-- 电脑主体 -->
      <rect x="60" y="60" width="300" height="200" rx="14" fill="url(#screen_grad)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <!-- 屏幕内容 -->
      <rect x="74" y="74" width="272" height="172" rx="8" fill="rgba(255,255,255,0.92)"/>
      <!-- 仪表盘图表区域 -->
      <rect x="84" y="84" width="252" height="100" rx="6" fill="rgba(37,99,235,0.05)"/>
      <!-- 折线图 -->
      <polyline points="94,168 118,148 142,155 166,132 190,140 214,118 238,126 262,108 286,116 320,100" stroke="url(#line_grad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polyline points="94,172 118,165 142,170 166,158 190,163 214,150 238,157 262,144 286,152 320,140" stroke="url(#line_grad2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 3"/>
      <!-- 图表点 -->
      <circle cx="190" cy="140" r="3.5" fill="#2563eb"/>
      <circle cx="214" cy="118" r="3.5" fill="#7c3aed"/>
      <circle cx="262" cy="108" r="3.5" fill="#0891b2"/>
      <!-- 底部卡片行 -->
      <rect x="84" y="192" width="76" height="48" rx="6" fill="rgba(37,99,235,0.08)"/>

              </svg>
            </span>
            <input type="text" class="form-input" id="captcha" placeholder="请输入验证码" maxlength="4">

<!-- 欢迎提示 -->
<div class="welcome-toast" id="welcomeToast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  验证通过，正在进入系统
</div>

<script>
  // 主题初始化
  (function() {
    const saved = localStorage.getItem('theme');
    const prefer = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || prefer);
  })();

  function toggleTheme() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }

  // 生成粒子
  (function createParticles() {
    const scene = document.getElementById('bgScene');
    const colors = [
      'rgba(99,102,241,0.5)', 'rgba(37,99,235,0.5)', 'rgba(14,165,233,0.5)',
      'rgba(16,185,129,0.4)', 'rgba(124,58,237,0.4)', 'rgba(217,119,6,0.4)'
    ];
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 6;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}%;
        top:${20 + Math.random() * 70}%;
        background:${colors[Math.floor(Math.random() * colors.length)]};
        --dur:${4 + Math.random() * 6}s;
        --delay:${Math.random() * 6}s;
      `;
      scene.appendChild(p);
    }
  })();

  // 密码显隐
  let pwdVisible = false;
  function togglePwd() {
    pwdVisible = !pwdVisible;
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    input.type = pwdVisible ? 'text' : 'password';
    icon.innerHTML = pwdVisible
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  // 刷新验证码
  const CAPS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function refreshCaptcha() {
    let code = '';
    for (let i = 0; i < 4; i++) code += CAPS[Math.floor(Math.random() * CAPS.length)];
    document.getElementById('captchaImg').textContent = code;
  }

  // 表单提交
  function handleLogin(e) {
    e.preventDefault();
    let valid = true;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const captcha = document.getElementById('captcha').value.trim();
    const captchaVal = document.getElementById('captchaImg').textContent;

    document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));

    if (!username) {
      document.getElementById('username-err').classList.add('show');
      valid = false;
    }
    if (!password) {
      document.getElementById('password-err').classList.add('show');
      valid = false;
    }
    if (!captcha) {
      document.getElementById('captcha-err').textContent = '请输入验证码';
      document.getElementById('captcha-err').classList.add('show');
      valid = false;
    } else if (captcha.toUpperCase() !== captchaVal) {
      document.getElementById('captcha-err').textContent = '验证码错误，请重新输入';
      document.getElementById('captcha-err').classList.add('show');
      refreshCaptcha();
      valid = false;
    }

    if (!valid) return;

    // 显示按钮加载状态
    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading');
    btn.innerHTML = `<span class="spinner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg></span> 验证中...`;
    btn.disabled = true;

    // 保存用户名用于工作台欢迎语
    localStorage.setItem('loginUser', username || '管理员');

    setTimeout(() => {
      // 显示欢迎 toast
      const toast = document.getElementById('welcomeToast');
      toast.classList.add('show');

      setTimeout(() => {
        // 显示全屏加载遮罩
        const loader = document.getElementById('pageLoader');
        loader.classList.add('active');

        // 动态切换提示文字
        const tips = ['正在加载工作台...', '获取数据中...', '初始化看板...', '即将完成...'];
        let tipIdx = 0;
        const tipEl = document.getElementById('loaderTip');
        const tipTimer = setInterval(() => {
          tipIdx = (tipIdx + 1) % tips.length;
          tipEl.style.opacity = '0';
          setTimeout(() => {
            tipEl.textContent = tips[tipIdx];
            tipEl.style.opacity = '1';
          }, 200);
        }, 400);

        setTimeout(() => {
          clearInterval(tipTimer);
          window.location.href = 'index.html';
        }, 1800);
      }, 400);
    }, 600);
  }
</script>
